{{define "content"}}
<header class="page-head">
  <h1>Dashboard</h1>
  <a class="btn" href="/" target="_blank" rel="noreferrer">View site ↗</a>
</header>

<section class="cards">
  {{range .Data.Counts}}
  <a class="card stat" href="/admin/{{.Res.Key}}">
    <span class="stat-value">{{.Count}}</span>
    <span class="stat-label">{{.Res.Plural}}</span>
  </a>
  {{end}}
</section>

<section>
  <h2>Quick links</h2>
  <ul class="links">
    <li><a href="/admin/settings">Edit texts, labels and section visibility</a></li>
    <li><a href="/admin/media">Upload a photo or CV</a></li>
    <li><a href="/admin/projects/new">Add a project</a> · <a href="/admin/papers/new">Add a paper</a></li>
    <li><a href="/api/v1/portfolio" target="_blank" rel="noreferrer">Inspect the JSON the site renders from ↗</a></li>
  </ul>
</section>
{{end}}
