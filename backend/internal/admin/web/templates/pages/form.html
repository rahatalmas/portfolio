{{define "content"}}
<header class="page-head">
  <h1>{{.Title}}</h1>
  <a class="btn" href="/admin/{{.Data.Res.Key}}">← Back to {{.Data.Res.Plural}}</a>
</header>

<form method="post" action="/admin/{{.Data.Res.Key}}/{{if .Data.ID}}{{.Data.ID}}{{else}}new{{end}}" class="edit">
  {{template "csrf" .}}
  {{template "media-datalist" .Data.Media}}
  <div class="grid">
    {{range .Data.Fields}}{{template "field" .}}{{end}}
  </div>
  <div class="actions">
    <button type="submit" class="btn primary">Save {{.Data.Res.Singular}}</button>
    <a class="btn" href="/admin/{{.Data.Res.Key}}">Cancel</a>
    {{if .Data.ID}}
    <span class="spacer"></span>
    <button type="submit" class="btn danger" formaction="/admin/{{.Data.Res.Key}}/{{.Data.ID}}/delete" onclick="return confirm('Delete this entry?')">Delete</button>
    {{end}}
  </div>
</form>
{{end}}
