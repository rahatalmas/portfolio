{{define "content"}}
<header class="page-head">
  <h1>Messages</h1>
</header>

{{if .Data}}
<table>
  <thead><tr><th>From</th><th>Message</th><th>Received</th><th class="actions-col"></th></tr></thead>
  <tbody>
  {{range .Data}}
    <tr class="{{if not .Read}}unread{{end}}">
      <td><a href="/admin/messages/{{.ID}}">{{.Name}}</a><br><a class="muted small" href="mailto:{{.Email}}">{{.Email}}</a></td>
      <td>{{truncate .Body 110}}</td>
      <td class="muted small nowrap">{{.Created}}</td>
      <td class="actions-col nowrap">
        <form method="post" action="/admin/messages/{{.ID}}/read" class="inline">
          {{template "csrf" $}}
          <input type="hidden" name="read" value="{{if .Read}}0{{else}}1{{end}}">
          <button class="btn small">{{if .Read}}Mark unread{{else}}Mark read{{end}}</button>
        </form>
        <form method="post" action="/admin/messages/{{.ID}}/delete" class="inline" onsubmit="return confirm('Delete this message?')">
          {{template "csrf" $}}
          <button class="btn small danger">Delete</button>
        </form>
      </td>
    </tr>
  {{end}}
  </tbody>
</table>
{{else}}
<div class="empty"><p>No messages yet. Submissions from the site's contact form appear here.</p></div>
{{end}}
{{end}}
