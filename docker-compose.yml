# The portfolio server (React site, API, admin, uploads) on port 8080.
# No database: content, messages and the admin account are JSON files in the
# `data` volume; uploaded media is in the `uploads` volume. Back up by copying
# those two volumes.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-admin
      SESSION_SECRET: change-me-to-a-long-random-string
      SECURE_COOKIES: "false" # set "true" behind an HTTPS proxy
    volumes:
      - data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  data:
  uploads:
