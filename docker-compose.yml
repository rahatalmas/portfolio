# MySQL + the Go backend (API, admin, uploads) on port 8080.
# The React site in frontend/ is deployed separately; build it with
# VITE_API_BASE pointing here and list its origin in CORS_ORIGINS below.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: change-me-db
      MYSQL_ROOT_PASSWORD: change-me-root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uportfolio", "-pchange-me-db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: portfolio
      DB_PASSWORD: change-me-db
      DB_NAME: portfolio
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-admin
      SESSION_SECRET: change-me-to-a-long-random-string
      CORS_ORIGINS: http://localhost:5173 # add your deployed site's origin
      SECURE_COOKIES: "false" # set "true" behind an HTTPS proxy
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
